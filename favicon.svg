<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Monogram Initials "SA" -->
  <text x="32" y="38" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="-1" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central">SA</text>

  <!-- QA Checkmark Badge -->
  <g filter="url(#shadow)">
    <circle cx="50" cy="50" r="11" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M46 50.2 L48.8 53 L54.5 47" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
